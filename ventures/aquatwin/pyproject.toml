[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquatwin"
version = "0.1.0"
description = "AquaTwin：泳池清洗机器人数字孪生与清洁经济性研究（独立应用）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aquatwin = "aquatwin.cli:main"

[tool.setuptools]
packages = ["aquatwin"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
