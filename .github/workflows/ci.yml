name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  software:
    name: 上位机 (pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e "software[vision,world,api,dev]" pyserial
      - name: 静态资产校验
        run: python3 tools/web_assets.py web
      - name: 测试
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest software/tests -q


  package:
    name: 打包 (wheel)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build
          cd software && python -m build --wheel --outdir ../out/dist
      - name: 导入 wheel
        run: |
          python -m pip install --no-deps out/dist/*.whl pyserial
          python -c "import modkit, modkit.gltf; print(modkit.__version__)"

  docker:
    name: Docker API (构建 + 健康检查)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -f software/Dockerfile -t modkit-api:ci .
      - name: 启动并检查
        run: |
          docker run -d --name modkit-api-ci \
            -e MODKIT_API_KEY=ci-key -p 127.0.0.1:18080:8080 modkit-api:ci
          sleep 2
          docker logs modkit-api-ci || true
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/v1/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:18080/v1/schemas
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/v1/world/validate)" = "401"
      - name: 停止
        if: always()
        run: |
          docker logs modkit-api-ci || true
          docker stop modkit-api-ci || true
          docker rm modkit-api-ci || true

  web-smoke:
    name: 网页冒烟 (Chrome + CDP)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 无头浏览器冒烟
        run: bash tools/web-smoke.sh

  aquatwin:
    name: AquaTwin (独立应用)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 测试
        run: |
          python -m pip install --upgrade pip pytest
          PYTHONPATH=ventures/aquatwin python -m pytest ventures/aquatwin/tests -q

  firmware:
    name: 固件 (g++ 主机测试)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 编译并测试
        run: make -C firmware test

  firmware-target:
    name: 固件 (ESP32-S3 目标编译)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.12
      - name: 安装 ESP32 核心
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: 目标编译
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/esp32/modkit_esp32

  cad:
    name: CAD 几何自检
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 build123d（约 2 分钟）
        run: pip install build123d trimesh rtree matplotlib
      - name: 构建 + 断言
        run: cd cad && python build.py
      - name: 可制造性（方向/悬垂/壁厚/时长）
        run: cd cad && python manufacture.py
      - name: 成本模型自检
        run: cd cad && python cost.py
      - name: 排产估算（5 套）
        run: cd cad && python plate.py --copies 5
      - name: 按数量排板（3 套）
        run: cd cad && python pack.py --copies 3
      - name: 工程图（13 页 PDF）
        run: cd cad && python drawings.py
      - name: 设计校核（力矩/刚度/公差/驱动）
        run: cd cad && python verify_design.py
      - name: 线束加工表 + 走线图
        run: cd cad && python harness.py
      - name: 设计空间（载荷×厚度）
        run: cd cad && python design_space.py
      - name: 工序卡（与 BOM 人工对账，差异 ≤10%）
        run: cd cad && python routing.py
      - name: 逐件打印参数
        run: cd cad && python print_profiles.py
      - name: 公差蒙特卡洛
        run: cd cad && python tolerance_mc.py
      - name: 文档链接检查
        run: python tools/linkcheck.py .
      - name: 跨文件一致性（文档索引/BOM/可制造性）
        run: python tools/consistency.py
      - name: 需求追溯（验证文件必须存在）
        run: python tools/traceability.py
      - name: 来料检验表
        run: python tools/incoming.py
      - name: 发布包工具自检（SHA256）
        run: |
          python tools/release.py --version 0.0.0 --out /tmp/dist
          python tools/release.py --check --out /tmp/dist
      - name: 产物上传
        uses: actions/upload-artifact@v4
        with:
          name: production-package
          path: |
            cad/out/manufacturing.json
            cad/out/cost.json
            docs/16-可制造性报告.md
            docs/17-成本模型.md
            docs/drawings/modkit-m1-drawings.pdf
            docs/20-设计校核.md

  sim:
    name: 仿真与可视化
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e software matplotlib numpy pillow pyserial
      - name: 底盘闭环判据
        run: make -C sim drive
      - name: 硬件场景回归（16 个）
        run: cd software && python -m modkit.cli simrun --all ../sim/scenarios
      - name: 蒙特卡洛冒烟（同种子）
        run: cd software && python -m modkit.cli simsweep --scenario ../sim/scenarios/nav_square.json -n 5 --profile clean --min-pass 1
      - name: 整机多视图
        run: make -C sim views
      - name: 上传图
        uses: actions/upload-artifact@v4
        with:
          name: sim-figures
          path: sim/out/*.png
