<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>modkit M1 · 实时查看器</title>
<style>
  :root {
    --ink: #1f2933; --muted: #6b7785; --line: #dfe6ef;
    --blue: #4c78a8; --green: #54a24b; --red: #e45756; --orange: #f58518;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.5 system-ui, "Noto Sans CJK SC", sans-serif; color: var(--ink); }
  body { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 1fr auto; background: #eaeff6; }

  aside {
    grid-row: 1 / 3; background: #fff; border-right: 1px solid var(--line);
    padding: 16px; overflow-y: auto;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }

  .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  .row label { font-size: 13px; }
  .row .val { font-variant-numeric: tabular-nums; color: var(--blue); font-weight: 600; min-width: 62px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--blue); }

  button {
    font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #f8fafc; color: var(--ink); cursor: pointer;
  }
  button:hover { background: #eef4fb; border-color: #c8d8ea; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.primary:hover { filter: brightness(1.05); }
  button.danger { background: var(--red); border-color: var(--red); color: #fff; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  #view { width: 100%; height: 100%; display: block; }

  .hud {
    position: absolute; left: 336px; top: 12px; background: rgba(255,255,255,.9);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    font-variant-numeric: tabular-nums; font-size: 12px; pointer-events: none;
  }
  .hud b { color: var(--blue); }

  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eef2f7; color: var(--muted); }
  .pill.ok { background: #e7f4e9; color: #2f7d32; }
  .pill.err { background: #fdeceb; color: #b3261e; }

  #log { max-height: 150px; overflow-y: auto; font: 11px/1.5 ui-monospace, monospace; }
  .logline { border-bottom: 1px dashed #eef2f7; padding: 2px 0; color: var(--muted); }
  .logline.ok { color: #2f7d32; }
  .logline.err { color: #b3261e; }

  footer {
    grid-column: 2; background: #fff; border-top: 1px solid var(--line);
    padding: 6px 12px; display: flex; gap: 16px; align-items: center; font-size: 12px;
  }
  .status { color: var(--muted); }
  .status.ok { color: #2f7d32; }
  .status.err { color: #b3261e; }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    aside { grid-row: 1; max-height: 42vh; }
    .hud { left: 12px; }
  }
</style>
</head>
<body>
<aside>
  <h1>modkit M1 · 实时查看器</h1>
  <div class="sub">尺寸来自 <code>cad/params.py</code>，正解与上位机同一套公式。</div>
  <div class="sub" style="margin-top:6px">
    <a href="https://github.com/gh503/robot-modkit/blob/main/docs/README.md">文档总目录</a> ·
    <a href="https://github.com/gh503/robot-modkit/blob/main/docs/28-%E7%94%9F%E4%BA%A7%E5%B0%B1%E7%BB%AA%E6%A3%80%E6%9F%A5.md">生产放行清单</a> ·
    <a href="https://github.com/gh503/robot-modkit/releases">版本发布</a> ·
    <a href="https://github.com/gh503/robot-modkit">仓库</a>
  </div>

  <div class="card">
    <h2>关节（拖动即动）</h2>
    <div class="row"><label>底座偏航</label><span class="val" id="v-yaw">0°</span></div>
    <input type="range" id="s-yaw">
    <div class="row"><label>肩</label><span class="val" id="v-shoulder">35°</span></div>
    <input type="range" id="s-shoulder">
    <div class="row"><label>肘</label><span class="val" id="v-elbow">-55°</span></div>
    <input type="range" id="s-elbow">
    <div class="row"><label>夹爪开合</label><span class="val" id="v-jaw">40 mm</span></div>
    <input type="range" id="s-jaw">
  </div>

  <div class="card">
    <h2>动作</h2>
    <div class="grid2">
      <button id="play" class="primary">▶ 播放抓取动画</button>
      <button id="reset">复位</button>
    </div>
    <div class="row" style="margin-top:8px"><label>当前阶段</label><span id="phase" style="color:var(--muted)">待机</span></div>
  </div>

  <div class="card">
    <h2>视角</h2>
    <div class="grid2">
      <button id="view-iso">轴测</button>
      <button id="view-front">正视</button>
      <button id="view-side">侧视</button>
      <button id="view-top">俯视</button>
    </div>
  </div>

  <div class="card">
    <h2>连接真机（可选） <span class="pill" id="serial-state">未连接</span></h2>
    <div class="grid2">
      <button id="serial-connect">连接串口</button>
      <button id="serial-send">下发当前姿态</button>
    </div>
    <button id="serial-estop" class="danger" style="width:100%;margin-top:6px">急停（全部卸力）</button>
    <button id="serial-follow" style="width:100%;margin-top:6px">跟随真机反馈（只读）</button>
    <div class="sub" style="margin:8px 0 4px">
      Chrome/Edge，需 https 或 localhost。串口 1Mbps，
      下发前先确认舵机 ID 与限位。
    </div>
    <div id="log"></div>
  </div>
</aside>

<canvas id="view"></canvas>
<div class="hud">指尖位置：<b id="fk">—</b></div>

<footer>
  <span class="status" id="status">加载中…</span>
  <span style="color:var(--muted)">鼠标左键旋转 · 右键平移 · 滚轮缩放</span>
</footer>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="scene.js"></script>
<script src="viewer.js"></script>
</body>
</html>
