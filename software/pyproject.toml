[project]
name = "modkit"
version = "1.37.0"
description = "可拆装模块化机器人：上位机软件（协议 / 运动学 / 仿真 / CLI）"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
vision = ["numpy>=1.24", "Pillow>=10"]
world = ["numpy>=1.24"]
plot = ["matplotlib>=3.6"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "numpy>=1.24"]

dev = ["pytest>=8", "httpx2>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["modkit"]
