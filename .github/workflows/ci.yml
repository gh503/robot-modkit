name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  software:
    name: 上位机 (pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e software pytest pyserial
      - name: 测试
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest software/tests -q

  firmware:
    name: 固件 (g++ 主机测试)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 编译并测试
        run: make -C firmware test

  cad:
    name: CAD 几何自检
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 build123d（约 2 分钟）
        run: pip install build123d trimesh rtree
      - name: 构建 + 断言
        run: cd cad && python build.py
      - name: 可制造性（方向/悬垂/壁厚/时长）
        run: cd cad && python manufacture.py
      - name: 成本模型自检
        run: cd cad && python cost.py
      - name: 产物上传
        uses: actions/upload-artifact@v4
        with:
          name: production-package
          path: |
            cad/out/manufacturing.json
            cad/out/cost.json
            docs/16-可制造性报告.md
            docs/17-成本模型.md

  sim:
    name: 仿真与可视化
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e software matplotlib numpy pillow pyserial
      - name: 底盘闭环判据
        run: make -C sim drive
      - name: 整机多视图
        run: make -C sim views
      - name: 上传图
        uses: actions/upload-artifact@v4
        with:
          name: sim-figures
          path: sim/out/*.png
