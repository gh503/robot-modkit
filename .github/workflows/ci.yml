name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  software:
    name: 上位机 (pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e software pytest pyserial
      - name: 测试
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest software/tests -q

  firmware:
    name: 固件 (g++ 主机测试)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 编译并测试
        run: make -C firmware test

  cad:
    name: CAD 几何自检
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 build123d（约 2 分钟）
        run: pip install build123d trimesh
      - name: 构建 + 断言
        run: cd cad && python build.py
