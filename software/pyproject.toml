[project]
name = "modkit"
version = "1.11.0"
description = "可拆装模块化机器人：上位机软件（协议 / 运动学 / 仿真 / CLI）"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
vision = ["numpy>=1.24", "Pillow>=10"]
plot = ["matplotlib>=3.6"]

dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
