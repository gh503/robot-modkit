[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquatwin"
version = "0.2.1"
description = "AquaTwin：泳池清洗机器人数字孪生、实测校准与清洁经济性"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["weasyprint>=60"]
dev = ["pytest>=8"]

[project.scripts]
aquatwin = "aquatwin.cli:main"

[tool.setuptools]
packages = ["aquatwin"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
